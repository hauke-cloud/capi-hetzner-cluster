# Default values for example.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# Hetzner related settings
hetzner:
  token:
    existingSecret:
      name: prod
      keys:
        hcloudToken: hcloud
        hetznerRobotPassword: robot-password
        hetznerRobotUser: robot-user
  sshKeys:
    - default-0

# Kubernetes
kubernetes:
  version: v1.37.1

# OIDC
oidc:
  enabled: false
  args:
    oidc-issuer-url: "https://example.com/realms/example"
    oidc-client-id: "client-id"
    oidc-username-claim: "email"
    oidc-username-prefix: "idp:"
    oidc-groups-claim: "groups"
    oidc-groups-prefix: "idp-groups:"

# Control Planes
controlPlanes:
  image: ubuntu-24.04
  nodes: 3
  regions:
    - fsn1
  flavor:
    name: cx22
  endpoint:
    host: ""
    port: 443
  loadBalancer:
    region: fsn1
  placement:
    type: spread
  # Replaces network.staticRoutes for the control planes only
  staticRoutes: {}
  kubeadmConfigTemplate: {}

# Workers
workers:
  - name: worker-1
    image: ubuntu-24.04
    minNodes: 0
    maxNodes: 5
    region: fsn1
    flavor:
      name: cx23
      cpu: 2
      memory: 4Gi
      ephemeralStorage: 40Gi
      # hugepages-1Gi: 0
      # hugepages-2Mi 0
      maxPods: 120
    placement:
      type: spread
    # Replaces network.staticRoutes for this worker group only
    staticRoutes: {}
    # Version of the bootstrap config of this worker group, appended to the name
    # of its KubeadmConfigTemplate. Existing nodes are not replaced when the
    # bootstrap config changes (static routes, kubeadmConfigTemplate, chart
    # upgrades), increase this to roll the group onto the current config.
    # Leaving it empty keeps the unversioned name. Replaced templates are kept
    # in the cluster and have to be removed by hand.
    configVersion: ""
    kubeadmConfigTemplate: {}

# Bootstrap
# Bootstrap the remote cluster with basic components
bootstrap:
  # Cilium remote installation
  # If enabled the Helm chart will create a Fluxv2 Helm repository and release
  # which will install Cilium via remote kubeconfig on the target cluster
  cilium:
    enabled: true
    version: 1.19.4
    repoOverrides:
      url: https://helm.cilium.io/
      interval: 5m0s
      type: default
    chartOverrides:
      name: cilium
      targetNamespace: kube-system
      interval: 5m0s
      values:
        hostFirewall:
          enabled: true
        extraArgs:
          - --direct-routing-device=eth0
        operator:
          tolerations:
            - key: "node-role.kubernetes.io/control-plane"
              operator: Exists
            - key: "node-role.kubernetes.io/master" #deprecated
              operator: Exists
            - key: "node.kubernetes.io/not-ready"
              operator: Exists
            - key: "node.cluster.x-k8s.io/uninitialized"
              operator: Exists
            - key: "node.cloudprovider.kubernetes.io/uninitialized"
              operator: Exists
      kubeConfig:
        secretRef:
          name: ""
          key: ""

  # Hetzner cloud controller manager remote installation
  # If enabled the Helm chart will create a Hetzner repository and CCM release
  # which will install the Hetzner CCM via remote kubeconfig on the target cluster
  hetznerCCM:
    enabled: true
    version: v1.31.1
    repoOverrides:
      url: https://charts.hetzner.cloud
      interval: 5m0s
      type: default
    chartOverrides:
      name: hcloud-cloud-controller-manager
      targetNamespace: kube-system
      interval: 5m0s
      values:
        additionalTolerations:
          - key: "node.cluster.x-k8s.io/uninitialized"
            operator: Exists
      kubeConfig:
        secretRef:
          name: ""
          key: ""

  # Hetzner CSI remote installation
  # If enabled the Helm chart will create a Hetzner repository and clusterAPIMode release
  # which will install the Hetzner CSI via remote kubeconfig on the target cluster
  hetznerCSI:
    enabled: true
    version: 2.21.2
    repoOverrides:
      url: https://charts.hetzner.cloud
      interval: 5m0s
      type: default
    chartOverrides:
      name: hcloud-csi
      targetNamespace: kube-system
      interval: 5m0s
      kubeConfig:
        secretRef:
          name: ""
          key: ""

  # Cluster Auto-Scaler remote installation
  # If enabled the Helm chart will create a CA repository and release
  # which will install the Cluster Auto-Scaler via remote kubeconfig on the target cluster
  autoscaler:
    enabled: true
    version: 9.50.1
    repoOverrides:
      url: https://kubernetes.github.io/autoscaler
      interval: 5m0s
      type: default
    chartOverrides:
      name: cluster-autoscaler
      interval: 5m0s
      values:
        cloudProvider: clusterapi
        clusterAPIMode: kubeconfig-incluster
        extraArgs:
          logtostderr: true
          stderrthreshold: ERROR
          v: 4
        rbac:
          additionalRules:
            - apiGroups:
                - infrastructure.cluster.x-k8s.io
              resources:
                - hcloudmachinetemplates
              verbs:
                - get
                - list
                - watch
      kubeConfig:
        secretRef:
          name: ""
          key: ""

  # Fluxv2 remote installation
  # If enabled the Helm chart will create a Fluxv2 repository and release
  # which will install the Fluxv2 via remote kubeconfig on the target cluster
  flux:
    enabled: true
    version: 9.50.1
    repoOverrides:
      url: https://github.com/fluxcd/flux2.git
      ref:
        branch: main
      interval: 5m0s
    kustomizationOverrides:
      path: ./manifests/install
      targetNamespace: flux-system
      interval: 5m0s
      prune: true
      timeout: 1m
      kubeConfig:
        secretRef:
          name: ""
          key: ""

# Network
network:
  hcloudNetwork:
    enabled: false
    # cidrBlock: 10.10.0.0/16
    # networkZone: eu-central
    # subnetCidrBlock: 10.10.5.0/24
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.244.0.0/16
  # Static routes for every node of the cluster.
  # They are written as a netplan drop-in to /etc/netplan/99-static-routes.yaml
  # and applied at the start of preKubeadmCommands, so they are already in place
  # while the nodes pull packages and images.
  # `interface` defaults to eth0 (public NIC), the private NIC of a Hetzner
  # network is usually enp7s0.
  # Set `controlPlanes.staticRoutes` or `workers[].staticRoutes` to replace this
  # for a single node group. Note that these routes are not rendered when a node
  # group provides its own full `kubeadmConfigTemplate`, since that replaces the
  # whole config including the files and commands they rely on.
  staticRoutes: {}
  #   interface: enp7s0
  #   routes:
  #     - to: 10.0.0.0/8
  #       via: 10.10.5.1

# Remedations
remedation:
  retryLimit: 1
  timeout: 180s
  type: Reboot

# Health checks
healthChecks:
  maxUnhealthy: 100%
  nodeStartupTimeout: 15m
  unhealhyConditions:
    - status: Unknown
      timeout: 180s
      type: Ready
    - status: "False"
      timeout: 180s
      type: Ready

nodeSelector: {}

tolerations: []

affinity: {}
